name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Ubuntu x86_64 ────────────────────────────────────────────────────────
  ubuntu:
    name: ubuntu-latest (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo
            ~/.rustup
          key: rust-${{ runner.arch }}-${{ hashFiles('install.sh') }}
          restore-keys: rust-${{ runner.arch }}-

      - uses: actions/cache@v6
        with:
          path: ~/.local/go
          key: go-${{ runner.arch }}-${{ hashFiles('install.sh') }}

      - name: install
        run: ./install.sh

      - name: test
        run: bash test.sh

  # ── Debian Bookworm x86_64 ───────────────────────────────────────────────
  debian:
    name: debian-bookworm (x86_64)
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
    steps:
      - uses: actions/checkout@v7

      - name: install
        run: ./install.sh

      - name: test
        run: bash test.sh

  # ── macOS ────────────────────────────────────────────────────────────────
  # Apple Silicon (work laptop) and Intel (older laptop); installs via Homebrew.
  macos:
    name: macos-latest (arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: install
        run: ./install.sh

      - name: test
        run: bash test.sh

  macos-intel:
    name: macos-15-intel (x86_64)
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v7

      - name: install
        run: ./install.sh

      - name: test
        run: bash test.sh

  # ── Ubuntu ARM64 ─────────────────────────────────────────────────────────
  ubuntu-arm:
    name: ubuntu-24.04 (arm64)
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo
            ~/.rustup
          key: rust-${{ runner.arch }}-${{ hashFiles('install.sh') }}
          restore-keys: rust-${{ runner.arch }}-

      - uses: actions/cache@v6
        with:
          path: ~/.local/go
          key: go-${{ runner.arch }}-${{ hashFiles('install.sh') }}

      - name: install
        run: ./install.sh

      - name: test
        run: bash test.sh
